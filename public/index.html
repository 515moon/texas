<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>texas</title>
  <style>
    body,
    body[data-theme=mint] {
      --bg1: #f3fbf8;
      --bg2: #dcefe8;
      --p: #fff;
      --p2: #e6f1ee;
      --t: #20302d;
      --a: #ff7a59;
      --at: #fff;
      --f1: #8fd6c4;
      --f2: #62bba7;
      --f3: #3e9c88;
      --rail: #e9d8b8;
      --rail2: #fff9;
      --s1: #fff;
      --s2: #f1f7f5;
      --st: #20302d;
      --ch: #d9532f;
      --bt: #1f8f78;
      --ft: #fff;
      --cb1: #3e9c88;
      --cb2: #2f8573;
      --line: #0001;
      --sh: #0002
    }

    body[data-theme=night] {
      --bg1: #262a58;
      --bg2: #0e1030;
      --p: #1b1e47;
      --p2: #2a2e63;
      --t: #eef0ff;
      --a: #ffc857;
      --at: #2a1b00;
      --f1: #4a52b8;
      --f2: #343b94;
      --f3: #1f2466;
      --rail: #0c0e2b;
      --rail2: #8f9bff44;
      --s1: #2f3470;
      --s2: #1f2350;
      --st: #eef0ff;
      --ch: #ffc857;
      --bt: #9ee7ff;
      --ft: #dfe3ff;
      --cb1: #5b64e0;
      --cb2: #3a42b3;
      --line: #ffffff1f;
      --sh: #0008
    }

    body[data-theme=sakura] {
      --bg1: #fff6f8;
      --bg2: #ffe1e9;
      --p: #fff;
      --p2: #ffe9ef;
      --t: #3b2630;
      --a: #8b5cf6;
      --at: #fff;
      --f1: #f9bccb;
      --f2: #ee8fa9;
      --f3: #d9708d;
      --rail: #f6e1d5;
      --rail2: #fff9;
      --s1: #fff;
      --s2: #fff1f5;
      --st: #3b2630;
      --ch: #7c3aed;
      --bt: #c2417a;
      --ft: #fff;
      --cb1: #d9708d;
      --cb2: #c4577a;
      --line: #0001;
      --sh: #0002
    }

    body[data-theme=classic] {
      --bg1: #1a2433;
      --bg2: #0b0d12;
      --p: #151a22;
      --p2: #212a37;
      --t: #eef1f5;
      --a: #e8b84a;
      --at: #1c1400;
      --f1: #13805f;
      --f2: #0c4b37;
      --f3: #06281d;
      --rail: #3a2616;
      --rail2: #e8b84a44;
      --s1: #1b2330;
      --s2: #0d1218;
      --st: #eef1f5;
      --ch: #e8b84a;
      --bt: #8fe8c8;
      --ft: #d6efe4;
      --cb1: #1e3d82;
      --cb2: #152b5e;
      --line: #ffffff1a;
      --sh: #0009
    }

    * {
      box-sizing: border-box;
      margin: 0
    }

    body {
      background: radial-gradient(130% 70% at 50% 0, var(--bg1), var(--bg2) 75%);
      color: var(--t);
      font: 14px system-ui, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
      overflow: hidden
    }

    [hidden] {
      display: none !important
    }

    input,
    button {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px;
      background: var(--p2);
      color: var(--t)
    }

    button {
      cursor: pointer;
      transition: transform .08s
    }

    button:active {
      transform: scale(.96)
    }

    button.pri {
      background: var(--a);
      color: var(--at);
      font-weight: 700;
      border-color: transparent
    }

    #lobby {
      margin: auto;
      width: min(340px, 90vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      animation: up .5s both
    }

    #lobby h1 {
      font-size: 30px;
      color: var(--a)
    }

    #jn {
      display: flex;
      gap: 6px
    }

    #jn input {
      flex: 1;
      min-width: 0;
      text-transform: uppercase
    }

    .sw {
      display: flex;
      gap: 12px;
      justify-content: center;
      padding: 6px
    }

    .sw button {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      padding: 0;
      border: 3px solid transparent;
      box-shadow: 0 2px 6px var(--sh)
    }

    .sw button.on {
      border-color: var(--a)
    }

    #tray {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 46px);
      right: 8px;
      background: var(--p);
      border-radius: 16px;
      box-shadow: 0 6px 20px var(--sh);
      z-index: 6;
      padding: 8px 12px;
      animation: up .2s both
    }

    #game {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0
    }

    header {
      display: flex;
      gap: 6px;
      align-items: center;
      padding: 8px 10px;
      background: var(--p);
      border-bottom: 1px solid var(--line);
      font-size: 13px
    }

    header span {
      flex: 1
    }

    header button {
      padding: 6px 10px
    }

    #table {
      flex: 1;
      position: relative;
      margin: 8px;
      border-radius: 90px;
      background: radial-gradient(ellipse at 50% 45%, var(--f1), var(--f2) 62%, var(--f3));
      border: 8px solid var(--rail);
      box-shadow: inset 0 0 0 2px var(--rail2), inset 0 0 60px #0003, 0 10px 26px var(--sh);
      min-height: 0
    }

    #mid {
      position: absolute;
      left: 50%;
      top: 47%;
      transform: translate(-50%, -50%);
      text-align: center;
      width: 92%
    }

    #pot {
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      min-height: 22px;
      text-shadow: 0 1px 3px #0006
    }

    #msg {
      font-size: 12px;
      color: var(--ft);
      margin-top: 6px;
      min-height: 16px;
      text-shadow: 0 1px 2px #0005
    }

    #board .c {
      font-size: 17px;
      min-width: 34px;
      padding: 6px 3px
    }

    .c {
      display: inline-block;
      min-width: 26px;
      padding: 3px 2px;
      margin: 1px;
      border-radius: 6px;
      background: #fff;
      color: #1b1f24;
      border: 1px solid #0002;
      font-weight: 700;
      font-style: normal;
      font-size: 13px;
      text-align: center;
      box-shadow: 0 2px 4px #0005
    }

    .c.r {
      color: #d62839
    }

    .c.bk {
      background: repeating-linear-gradient(45deg, var(--cb1), var(--cb1) 3px, var(--cb2) 3px, var(--cb2) 6px);
      color: transparent;
      border: 2px solid #fff
    }

    .c.deal {
      animation: deal .5s cubic-bezier(.2, .8, .25, 1) both
    }

    .c.flip {
      animation: flip .5s ease-out both
    }

    .seat {
      position: absolute;
      transform: translate(-50%, -50%);
      width: 92px;
      text-align: center;
      background: linear-gradient(var(--s1), var(--s2));
      color: var(--st);
      border-radius: 14px;
      padding: 4px;
      border: 1.5px solid var(--line);
      box-shadow: 0 4px 12px var(--sh);
      font-size: 12px
    }

    .seat.me .c {
      font-size: 16px;
      min-width: 32px;
      padding: 5px 2px
    }

    .seat.turn {
      border-color: var(--a);
      animation: glow 1.1s ease-in-out infinite alternate
    }

    .seat.win {
      border-color: var(--a);
      animation: glow .7s ease-in-out infinite alternate
    }

    .seat.fold {
      opacity: .45
    }

    .seat.off .nm {
      text-decoration: line-through
    }

    .cd {
      min-height: 22px
    }

    .nm {
      font-weight: 600
    }

    .ch {
      color: var(--ch);
      font-weight: 700
    }

    .bt {
      color: var(--bt);
      font-weight: 600;
      font-size: 11px;
      min-height: 14px
    }

    .bt.pop {
      animation: pop .4s both
    }

    .dl {
      background: var(--a);
      color: var(--at);
      border-radius: 50%;
      padding: 0 5px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 3px
    }

    .say {
      position: absolute;
      left: 50%;
      top: -16px;
      transform: translateX(-50%);
      background: var(--a);
      color: var(--at);
      padding: 2px 9px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      z-index: 2;
      box-shadow: 0 2px 8px var(--sh)
    }

    .say.new {
      animation: sayin .3s both
    }

    .say.w {
      top: -22px;
      font-size: 15px
    }

    #pot.bump {
      animation: bump .35s
    }

    #act {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 8px
    }

    #act>.row {
      animation: up .25s both
    }

    #f {
      background: var(--p2);
      color: #d9455f
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .row>* {
      flex: 1
    }

    .row input[type=range] {
      padding: 0;
      accent-color: var(--a)
    }

    #pn {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 46%;
      background: var(--p);
      z-index: 5;
      display: flex;
      flex-direction: column;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -4px 20px var(--sh);
      animation: up .25s both
    }

    #tabs {
      display: flex;
      gap: 4px;
      padding: 6px
    }

    #tabs button {
      flex: 1;
      padding: 8px
    }

    #tabs button.on {
      background: var(--a);
      color: var(--at);
      font-weight: 700
    }

    #pb {
      flex: 1;
      overflow: auto;
      padding: 4px 10px
    }

    #pb p {
      padding: 3px 0;
      border-bottom: 1px solid var(--line)
    }

    #cr {
      display: flex;
      gap: 6px;
      padding: 6px
    }

    #cr input {
      flex: 1;
      min-width: 0
    }

    @keyframes deal {
      from {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) rotate(-35deg) scale(.35)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes flip {
      from {
        opacity: 0;
        transform: perspective(400px) rotateY(90deg) translateY(-24px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes pop {
      0% {
        transform: scale(.3);
        opacity: 0
      }

      60% {
        transform: scale(1.3)
      }

      100% {
        transform: none;
        opacity: 1
      }
    }

    @keyframes glow {
      to {
        box-shadow: 0 0 0 3px var(--a), 0 0 22px var(--a)
      }
    }

    @keyframes up {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes sayin {
      from {
        opacity: 0;
        transform: translate(-50%, 8px) scale(.6)
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0) scale(1)
      }
    }

    @keyframes bump {
      50% {
        transform: scale(1.35)
      }
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div id="lobby">
    <h1>🃏</h1>
    <div class="sw"></div>
    <input id="nick" maxlength="10" placeholder="닉네임">
    <button id="mk" class="pri">방 만들기</button>
    <div id="jn"><input id="rc" maxlength="5" placeholder="방 코드"><button id="jb">입장</button></div>
  </div>
  <div id="game" hidden>
    <header><span>방 <b id="code"></b> · <span id="blind"></span><span id="nxt"></span> <b id="tm"></b></span>
      <button id="th">🎨</button><button id="inv">초대</button><button id="pbtn">💬</button><button id="lv">나가기</button>
    </header>
    <div id="tray" class="sw" hidden></div>
    <div id="table">
      <div id="seats"></div>
      <div id="mid">
        <div id="pot"></div>
        <div id="board"></div>
        <div id="msg"></div><button id="start" class="pri" hidden>게임 시작</button>
      </div>
    </div>
    <div id="act"></div>
  </div>
  <div id="pn" hidden>
    <div id="tabs"><button data-t="chat" class="on">채팅</button><button data-t="log">진행</button><button
        data-t="hist">기록</button><button id="x">✕</button></div>
    <div id="pb"></div>
    <div id="cr"><input id="ci" maxlength="200" placeholder="메시지"><button id="cb">전송</button></div>
  </div>
  <script>
    const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const pid = localStorage.pid || (localStorage.pid = Math.random().toString(36).slice(2) + Date.now().toString(36));
    const room = new URLSearchParams(location.search).get('r');
    const POS = [[50, 90], [13, 70], [13, 28], [50, 8], [87, 28], [87, 70]], SU = { s: '♠', h: '♥', d: '♦', c: '♣' }, LIVE = ['preflop', 'flop', 'turn', 'river'];
    let ws, S = null, pend = null, tab = 'chat', akey = '';
    const tx = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
    const cd = (c, x = '', st = '') => c === '??' ? `<i class="c bk ${x}" style="${st}">?</i>` : `<i class="c ${'hd'.includes(c[1]) ? 'r' : ''} ${x}" style="${st}">${c[0] === 'T' ? '10' : c[0]}${SU[c[1]]}</i>`;
    const TH = [['mint', '민트', '#62bba7'], ['night', '밤하늘', '#343b94'], ['sakura', '벚꽃', '#ee8fa9'], ['classic', '클래식', '#0c4b37']];
    function theme(n) {
      document.body.dataset.theme = n; try { localStorage.theme = n } catch { }
      document.querySelectorAll('.sw button').forEach(b => b.classList.toggle('on', b.dataset.n === n)); $('#tray').hidden = true
    }
    document.querySelectorAll('.sw').forEach(el => el.innerHTML = TH.map(([n, l, c]) => `<button data-n="${n}" title="${l}" style="background:${c}"></button>`).join(''));
    document.querySelectorAll('.sw button').forEach(b => b.onclick = () => theme(b.dataset.n));
    $('#th').onclick = () => $('#tray').hidden = !$('#tray').hidden;
    theme(localStorage.theme || 'mint');

    $('#nick').value = localStorage.nick || '';
    if (room) { $('#mk').textContent = '입장하기 (' + room.toUpperCase() + ')'; $('#jn').hidden = true }
    function go(m) {
      const nick = $('#nick').value.trim(); if (!nick) return alert('닉네임을 입력하세요');
      localStorage.nick = nick; pend = { ...m, nick, pid }; conn()
    }
    $('#mk').onclick = () => go(room ? { t: 'join', room } : { t: 'create' });
    $('#jb').onclick = () => { const c = $('#rc').value.trim(); if (c) go({ t: 'join', room: c }) };
    function conn() {
      if (ws) { ws.onclose = null; ws.close() }
      ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
      ws.onopen = () => ws.send(JSON.stringify(pend));
      ws.onmessage = e => {
        const m = JSON.parse(e.data);
        if (m.t === 'joined') { pend = { t: 'join', room: m.room, nick: pend.nick, pid }; history.replaceState(0, '', '?r=' + m.room) }
        else if (m.t === 'err') { alert(m.m); pend = null; ws.close() }
        else if (m.t === 's') { S = m.s; S.at = Date.now(); render() }
      };
      ws.onclose = () => { if (pend) setTimeout(conn, 1500) };
    }
    setInterval(() => tx({ t: 'p' }), 25000);

    const prev = { hand: -1, board: 0, cards: [], bets: [], pot: 0, last: '', win: -1 }; let say = null;
    function render() {
      const s = S, me = s.you, nh = s.hand !== prev.hand;
      if (nh) { prev.board = 0; prev.cards = []; prev.bets = [] }
      $('#lobby').hidden = true; $('#game').hidden = false;
      $('#code').textContent = s.code; $('#blind').textContent = `블라인드 ${s.blinds[0]}/${s.blinds[1]}`;
      $('#board').innerHTML = s.board.map((c, i) => i >= prev.board ? cd(c, 'flip', `animation-delay:${(i - prev.board) * 130}ms`) : cd(c)).join('');
      const pe = $('#pot'); pe.textContent = s.pot ? `팟 ${s.pot.toLocaleString()}` : '';
      if (s.pot > prev.pot) { pe.classList.remove('bump'); void pe.offsetWidth; pe.classList.add('bump') }
      const last = s.log.at(-1) || '';
      if (last !== prev.last && LIVE.includes(s.phase)) {
        const i = s.seats.findIndex(p => p && last.startsWith(p.nick + ' '));
        if (i >= 0) { say = { i, t: last.slice(s.seats[i].nick.length + 1), until: Date.now() + 1700 }; setTimeout(render, 1750) }
      }
      prev.last = last;
      const tb = $('#table'), W = tb.clientWidth, H = tb.clientHeight, winLine = s.phase === 'show' && last.startsWith('🏆') ? last : '';
      let k = 0; const nc = [], nb = [];
      $('#seats').innerHTML = s.seats.map((p, i) => {
        if (!p) return ''; const [x, y] = POS[(i - me + 6) % 6];
        const key = p.cards.join(), pk = prev.cards[i] || ''; nc[i] = key; nb[i] = p.bet;
        const an = key && !pk ? 'deal' : pk.includes('??') && key && !key.includes('??') ? 'flip' : '';
        const fly = `--dx:${Math.round((50 - x) / 100 * W)}px;--dy:${Math.round((47 - y) / 100 * H)}px`;
        const cards = p.cards.map((c, ci) => cd(c, an, `${fly};animation-delay:${an === 'deal' ? (k * 2 + ci) * 90 : ci * 120}ms`)).join('');
        if (an === 'deal') k++;
        const wi = winLine ? winLine.indexOf(p.nick + ' +') : -1;
        const bub = wi >= 0 ? `<div class="say w ${prev.win !== s.hand ? 'new' : ''}">+${(parseInt(winLine.slice(wi + p.nick.length + 2)) || 0).toLocaleString()}</div>`
          : say && say.i === i && Date.now() < say.until ? `<div class="say new">${esc(say.t)}</div>` : '';
        return `<div class="seat ${i === me ? 'me' : ''} ${s.turn === i ? 'turn' : ''} ${wi >= 0 ? 'win' : ''} ${p.fold ? 'fold' : ''} ${p.on ? '' : 'off'}" style="left:${x}%;top:${y}%">${bub}<div class="cd">${cards}</div><div class="nm">${esc(p.nick)}${s.dealer === i && s.phase !== 'wait' ? '<span class="dl">D</span>' : ''}</div><div class="ch">${p.chips.toLocaleString()}${p.allin ? ' 올인' : ''}</div><div class="bt ${p.bet > (prev.bets[i] || 0) ? 'pop' : ''}">${p.bet ? '● ' + p.bet : ''}</div></div>`
      }).join('');
      if (winLine) prev.win = s.hand;
      Object.assign(prev, { hand: s.hand, board: s.board.length, cards: nc, bets: nb, pot: s.pot });
      const n = s.seats.filter(Boolean).length, m = s.seats.filter(p => p && p.chips > 0).length;
      $('#start').hidden = !(s.host && s.phase === 'wait' && m > 1);
      $('#msg').textContent = s.phase === 'wait' ? (m > 1 ? (s.host ? '시작 버튼을 눌러주세요' : '방장이 시작하길 기다리는 중') : n < 2 ? `초대 링크로 친구를 불러오세요 (${n}/6)` : '칩이 있는 사람이 2명 이상 필요해요') : (s.log.at(-1) || '');
      actions(); panel();
    }
    function actions() {
      const s = S, p = s.seats[s.you], mine = s.turn === s.you && LIVE.includes(s.phase);
      const broke = p.chips === 0 && !(LIVE.includes(s.phase) && p.in);
      const key = [mine, broke, s.bet, s.minRaise, p.chips, p.bet, s.phase].join();
      if (key === akey) return; akey = key;
      const A = $('#act');
      if (broke) {
        A.innerHTML = `<div class="row"><button id="rb" class="pri">다시 ${s.rebuy.toLocaleString()} 받기</button><button id="lv2">나가기</button></div>`;
        $('#rb').onclick = () => tx({ t: 'rebuy' }); $('#lv2').onclick = () => $('#lv').click(); return
      }
      if (!mine) { A.innerHTML = ''; return }
      const need = s.bet - p.bet, max = p.bet + p.chips, min = Math.min(max, s.bet + s.minRaise), canR = max > s.bet, lb = s.bet ? '레이즈' : '벳';
      A.innerHTML = `<div class="row"><button id="f">폴드</button><button id="c" class="pri">${need > 0 ? '콜 ' + Math.min(need, p.chips) : '체크'}</button></div>` +
        (canR ? `<div class="row"><input id="rg" type="range" min="${min}" max="${max}" value="${min}"><button id="r" class="pri"></button></div><div class="row"><button data-q=".5">½ 팟</button><button data-q="1">팟</button><button data-q="m">올인</button></div>` : '');
      $('#f').onclick = () => tx({ t: 'act', a: 'fold' }); $('#c').onclick = () => tx({ t: 'act', a: 'call' });
      if (!canR) return;
      const rg = $('#rg'), rb = $('#r'), upd = () => rb.textContent = (+rg.value >= max ? '올인 ' : lb + ' ') + rg.value;
      rg.oninput = upd; upd(); rb.onclick = () => tx({ t: 'act', a: 'raise', amt: +rg.value });
      A.querySelectorAll('[data-q]').forEach(b => b.onclick = () => {
        const q = b.dataset.q, v = q === 'm' ? max : Math.round(s.bet + (s.pot + need) * q);
        rg.value = Math.max(min, Math.min(max, v)); upd()
      });
    }
    function panel() {
      const el = $('#pb'); $('#cr').hidden = tab !== 'chat';
      el.innerHTML = tab === 'chat' ? S.chat.map(m => `<p><b>${esc(m.n)}</b> ${esc(m.x)}</p>`).join('') :
        tab === 'log' ? S.log.map(x => `<p>${esc(x)}</p>`).join('') :
          S.hist.map(h => `<p>#${h.n} ${h.board.map(c => cd(c)).join('')}<br>${h.w.map(esc).join(' · ')}</p>`).join('') || '<p>아직 기록이 없어요</p>';
      el.scrollTop = tab === 'hist' ? 0 : 1e9;
    }
    setInterval(() => {
      if (!S) return; const el = Date.now() - S.at;
      const t = S.dl && LIVE.includes(S.phase) ? Math.max(0, Math.ceil((S.dl - el) / 1000)) : 0;
      const nx = S.next > 0 ? Math.max(0, Math.ceil((S.next - el) / 1000)) : 0;
      $('#tm').textContent = t ? `⏱${t}` : ''; $('#nxt').textContent = nx ? ` · 인상 ${Math.floor(nx / 60)}:${String(nx % 60).padStart(2, '0')}` : ''
    }, 1000);

    $('#start').onclick = () => tx({ t: 'start' });
    $('#pbtn').onclick = () => { $('#pn').hidden = !$('#pn').hidden; if (S) panel() }; $('#x').onclick = () => $('#pn').hidden = true;
    document.querySelectorAll('#tabs [data-t]').forEach(b => b.onclick = () => {
      tab = b.dataset.t;
      document.querySelectorAll('#tabs [data-t]').forEach(x => x.classList.toggle('on', x === b)); panel()
    });
    const chat = () => { const x = $('#ci').value.trim(); if (x) { tx({ t: 'chat', x }); $('#ci').value = '' } };
    $('#cb').onclick = chat; $('#ci').onkeydown = e => { if (e.key === 'Enter') chat() };
    $('#inv').onclick = async () => {
      const u = location.origin + '/?r=' + S.code;
      if (navigator.share) try { await navigator.share({ title: '친구 홀덤', text: '홀덤 한판 하자!', url: u }); return } catch { }
      try { await navigator.clipboard.writeText(u); alert('초대 링크를 복사했어요') } catch { prompt('링크를 복사하세요', u) }
    };
    $('#lv').onclick = () => { if (!confirm('방에서 나갈까요?')) return; tx({ t: 'leave' }); pend = null; ws.close(); location.href = '/' };
  </script>
</body>
